<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#070c12" />
        <title>3D Arcade · VibeCreAI Arcade</title>
        <meta name="description" content="Walk through Samson’s 3D arcade to play his Astrocade games, explore his Chroma Awards entries, and find his apps and social channels." />
        <link rel="canonical" href="https://www.vibecreai.com/" />
        <link rel="icon" type="image/png" href="/images/favicon.png" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.vibecreai.com/" />
        <meta property="og:title" content="VibeCreAI Arcade" />
        <meta property="og:description" content="Walk through Samson’s 3D arcade and discover his games and apps." />
        <meta property="og:image" content="https://www.vibecreai.com/images/vibecreai-arcade-share.jpg" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Samson types at his laptop beside two arcade cabinets under the VibeCreAI pixel logo and cyan alien." />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@VibeCreAI" />
        <meta name="twitter:image" content="https://www.vibecreai.com/images/vibecreai-arcade-share.jpg" />
        <meta name="twitter:image:alt" content="Samson types at his laptop beside two arcade cabinets under the VibeCreAI pixel logo and cyan alien." />
        <script src="/js/locale.js"></script>
        <link rel="preload" href="/fonts/Born2bSportyFS.otf" as="font" type="font/otf" crossorigin />
        <link rel="preload" href="/fonts/DungGeunMo.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="/styles/language.css" />
        <link rel="stylesheet" href="/styles/creator-models.css" />
        <link rel="stylesheet" href="/cartridge-cove/cove.css" />
        <link rel="stylesheet" href="/styles/arcade-covers.css" />
    </head>
    <body class="booting">
        <header class="mast">
            <a class="wordmark" href="#desk" aria-label="Return to Samson’s desk">
                <span>V<small>IBE</small>C<small>RE</small><b>AI</b></span>
            </a>
            <button type="button" class="settings-toggle" popovertarget="arcade-settings" aria-label="Arcade settings" title="Arcade settings">
                <svg width="48" height="32" viewBox="0 0 48 32" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
                    <defs>
                        <g id="menu-slab">
                            <path fill="#000" d="M0 0h42v1h2v1h2v1h2v7H6V9H4V8H2V7H0z" />
                            <path fill="#566976" d="M3 5h38l4 3H7z" />
                            <path fill="#92acb6" d="M40 2h2v1h2v1h1v4h-2V7h-2V6h-1z" />
                            <path fill="currentColor" d="M3 2h37v4H3z" />
                            <path fill="#fff" d="M3 2h37v1H3z" />
                        </g>
                        <path id="menu-cross" d="m16 8 14 14m0-14L16 22" />
                    </defs>
                    <g class="menu-bars">
                        <use href="#menu-slab" />
                        <use href="#menu-slab" y="11" />
                        <use href="#menu-slab" y="22" />
                    </g>
                    <g class="menu-close" fill="none" stroke-linecap="square">
                        <use href="#menu-cross" stroke="#000" stroke-width="8" />
                        <use href="#menu-cross" transform="translate(2 2)" stroke="#000" stroke-width="8" />
                        <use href="#menu-cross" transform="translate(2 2)" stroke="#377b88" stroke-width="4" />
                        <use href="#menu-cross" stroke="currentColor" stroke-width="4" />
                    </g>
                </svg>
            </button>
            <div id="arcade-settings" popover role="group" aria-label="Arcade settings">
                <button type="button" id="arcade-sound" aria-label="Arcade sound" aria-pressed="true" hidden>
                    <span>Sound</span>
                    <span class="sound-state" aria-hidden="true"><span class="sound-off">Off</span><span class="sound-on">On</span></span>
                </button>
                <div class="arcade-language" role="group" aria-labelledby="settings-language">
                    <span id="settings-language">Language</span>
                    <button type="button" lang="en" data-language="en" aria-pressed="true">English</button>
                    <button type="button" lang="ko" data-language="ko" aria-pressed="false">한국어</button>
                </div>
            </div>
        </header>
        <div id="arcade-boot">
            <div class="boot-cabinet">
                <div class="boot-screen">
                    <div class="boot-art" aria-hidden="true">
                        <img src="/images/arcade-bot.png" width="64" height="64" alt="" />
                    </div>
                    <div class="boot-title" aria-label="VibeCreAI">V<small>IBE</small>C<small>RE</small><b>AI</b></div>
                    <div class="boot-subtitle">Video Arcade</div>
                    <div class="boot-readout">
                        <span id="boot-label" role="status">Loading the arcade</span>
                        <span id="boot-percent" aria-hidden="true">0%</span>
                    </div>
                    <progress id="boot-progress" max="11" value="0" aria-label="Arcade loading progress"></progress>
                </div>
                <div class="boot-trim" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
            </div>
            <a class="boot-home" href="/classic.html">Open 2D homepage ↗</a>
        </div>
        <script>VibeLocale.localize(document.getElementById('arcade-boot'));</script>
        <div id="route-scroll" inert>
            <div id="arcade-stage">
                <div id="world" aria-hidden="true"></div>
                <nav class="station-travel" id="station-travel" aria-label="Station navigation">
                    <button type="button" class="travel-arrow previous" id="previous-station" aria-label="Previous station" hidden>
                        <img src="/images/station-arrow.webp" width="40" height="40" alt="" />
                    </button>
                    <button type="button" class="travel-arrow next" id="next-station" aria-label="Next station">
                        <img src="/images/station-arrow.webp" width="40" height="40" alt="" />
                    </button>
                </nav>
                <div class="floor-controls">
                    <button
                        class="guide hud-panel"
                        id="map-button"
                        aria-haspopup="dialog"
                        aria-controls="map"
                        aria-label="Choose a station"
                        title="Choose a station (M)"
                    >
                        <span class="position-label" id="now">Samson’s desk</span>
                        <strong id="hint">Station select</strong>
                        <span class="station-switch" aria-hidden="true">⌃</span>
                        <span class="meter"><i id="progress"></i></span>
                    </button>
                    <nav class="quick-socials hud-panel" id="quick-socials" aria-label="Featured social channels"></nav>
                </div>
                <main id="destination" hidden>
                    <article class="paper" aria-label="Station content">
                        <button id="return" class="back">← Back to the floor</button>
                        <div class="paper-body">
                            <div id="pages"></div>
                            <button id="continue" class="primary"></button>
                        </div>
                    </article>
                </main>
            </div>
            <div id="scroll-space" aria-hidden="true"></div>
        </div>
        <dialog id="map" aria-labelledby="map-title">
            <div class="dialog-head">
                <h2 id="map-title">Station select</h2>
                <button class="close" aria-label="Close station select">×</button>
            </div>
            <nav id="stations" aria-label="Travel to a station"></nav>
            <nav id="contacts" aria-label="All social and contact links"></nav>
        </dialog>
        <noscript><a href="/classic.html">Explore the VibeCreAI homepage</a></noscript>
        <script src="/js/vendor/three/three.min.js"></script>
        <script src="/js/vendor/three/GLTFLoader.js"></script>
        <script type="module" src="/cartridge-cove/walk.js"></script>
    </body>
</html>
